name: Hydrolyze
options:
  bundleIdPrefix: com.hydrolyze
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Hydrolyze:
    type: application
    platform: iOS
    sources:
      - path: Hydrolyze/Sources
      - path: Hydrolyze/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hydrolyze.mobile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Hydrolyze/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        # Code signing — required for real device install (iOS won't install unsigned binaries)
        # User sets their team ID in Xcode (Settings → Accounts), automatic signing handles the rest
        CODE_SIGN_STYLE: "Automatic"
        DEVELOPMENT_TEAM: "37S7KT7W83"
        CODE_SIGN_IDENTITY: "iPhone Developer"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - package: Supabase
        product: Supabase
  HydrolyzeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Hydrolyze/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hydrolyze.tests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # Test target needs to access Hydrolyze's internal types
        # (PairingEngine, Prediction, WaveAssignment, Lap). The
        # @testable import in the test file + bundle.unit-test type
        # + dependency on Hydrolyze is sufficient. No bridging header
        # needed.
    dependencies:
      - target: Hydrolyze
schemes:
  Hydrolyze:
    build:
      targets:
        Hydrolyze: all
        HydrolyzeTests: [test]
    test:
      targets:
        - HydrolyzeTests
