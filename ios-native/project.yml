name: Hydrolyze
options:
  bundleIdPrefix: com.hydrolyze
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Hydrolyze:
    type: application
    platform: iOS
    sources:
      - path: Hydrolyze/Sources
      - path: Hydrolyze/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hydrolyze.mobile
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Hydrolyze/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        # Code signing — required for real device install (iOS won't install unsigned binaries)
        # User sets their team ID in Xcode (Settings → Accounts), automatic signing handles the rest
        CODE_SIGN_STYLE: "Automatic"
        DEVELOPMENT_TEAM: "37S7KT7W83"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - package: Supabase
        product: Supabase
  HydrolyzeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # 2026-09-10: Hydrolyze/Tests holds THREE idioms, only one of which can
      # live in an XCTest bundle:
      #   1. *Test.swift            — real XCTest (@testable import Hydrolyze). KEEP.
      #   2. *Smoke.swift           — standalone scripts with TOP-LEVEL code. They
      #                               do NOT @testable-import; they REDECLARE
      #                               production enums/structs and assert on the
      #                               copy. They cannot compile into a bundle
      #                               ("expressions are not allowed at the top
      #                               level") and they cannot fail when production
      #                               breaks. Run them with their own runner.
      #   3. CLI/*CLITest.swift     — standalone CLI harnesses, written because
      #                               "no Xcode required" on the orchestrator Mac.
      #                               Same top-level-code problem.
      # Excluding 2 and 3 is what makes `xcodebuild test` runnable at all.
      - path: Hydrolyze/Tests
        excludes:
          - "CLI/**"
          - "*Smoke.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hydrolyze.tests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # 2026-09-10: without this the test bundle cannot code sign and
        # `xcodebuild test` dies before running a single test:
        #   "Cannot code sign because the target does not have an Info.plist
        #    file and one is not being generated automatically."
        # The app target supplies its own INFOPLIST_FILE; the test bundle has
        # none, so it must generate one. This is why the test target had never
        # been buildable.
        GENERATE_INFOPLIST_FILE: "YES"
        # Test target needs to access Hydrolyze's internal types
        # (PairingEngine, Prediction, WaveAssignment, Lap). The
        # @testable import in the test file + bundle.unit-test type
        # + dependency on Hydrolyze is sufficient. No bridging header
        # needed.
    dependencies:
      - target: Hydrolyze
schemes:
  Hydrolyze:
    build:
      targets:
        Hydrolyze: all
        HydrolyzeTests: [test]
    test:
      targets:
        - HydrolyzeTests
