name: RawWorkoutScreenshotApp
options:
  bundleIdPrefix: com.hydrolyze
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

targets:
  RawWorkoutScreenshotApp:
    type: application
    platform: iOS
    sources:
      # Screenshot-app target. Path is RELATIVE to the project.yml
      # location (this directory: /ios-native).
      - path: ../screenshot-harness/RawWorkoutScreenshotApp.swift
      # The production view + classifier, compiled in as plain
      # files (NOT via the Hydrolyze target — we don't want the
      # full app's dependencies leaking into the harness).
      - path: Hydrolyze/Sources/Views/Workouts/RawWorkoutTextView.swift
      - path: Hydrolyze/Sources/Views/Workouts/RawWorkoutLineClassifier.swift
      # Color + typography tokens the view references. Standalone
      # copies — we don't pull in the rest of the Hydrolyze module.
      - path: Hydrolyze/Sources/Lib/HydrolyzeColors.swift
      - path: Hydrolyze/Sources/Lib/Color+Hex.swift
      - path: Hydrolyze/Sources/Lib/HydrolyzeType.swift
      - path: Hydrolyze/Sources/Lib/JetBrainsMonoFont.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hydrolyze.raw-screenshot
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  RawWorkoutScreenshotApp:
    build:
      targets:
        RawWorkoutScreenshotApp: all